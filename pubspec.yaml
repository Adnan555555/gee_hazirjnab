name: gee_hazirjnab
description: "Gee Hazirjnab - Handyman Service Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # UI Enhancements
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Forms & Inputs
  pinput: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Carousel
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0
  

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  carousel_custom_slider:
  connectivity_plus: ^5.0.2   # ← pinned
  image_picker: ^1.0.7
  url_launcher: ^6.2.6

  # Firebase / Push Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10


  flutter_launcher_icons: ^0.13.1
  google_fonts: ^6.2.1
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/hj-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#031A3E"
  adaptive_icon_foreground: "assets/icons/hj-icon.png"